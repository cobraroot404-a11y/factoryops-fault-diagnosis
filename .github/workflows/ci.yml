name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app worker simulator scripts/fault_ctl.py
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend

  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest tests/worker -v --junitxml=junit-worker-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-worker-unit, path: junit-worker-unit.xml, retention-days: 14 }

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt -r worker/requirements.txt -r simulator/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  container-build-and-compose-integration:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-unit-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Generate local-only CI secrets
        run: |
          cp .env.example .env
          python3 - <<'PY'
import secrets
lines = open(".env").read().splitlines()
out = []
for line in lines:
    if line.startswith(("POSTGRES_PASSWORD=", "RABBITMQ_DEFAULT_PASS=", "JWT_SECRET=", "GRAFANA_ADMIN_PASSWORD=")):
        key = line.split("=")[0]
        out.append(f"{key}={secrets.token_urlsafe(24)}")
    else:
        out.append(line)
open(".env", "w").write("\n".join(out) + "\n")
PY

      - name: Container builds
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env build

      - name: Start core stack
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env up -d postgres rabbitmq backend outbox-relay diagnosis-worker missing-telemetry-checker frontend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8000/health > /dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          docker compose -f infra/compose/docker-compose.yml --env-file .env logs
          exit 1

      - name: Migrate + seed
        run: |
          docker compose -f infra/compose/docker-compose.yml --env-file .env run --rm backend alembic upgrade head
          docker compose -f infra/compose/docker-compose.yml --env-file .env run --rm backend python seed.py

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt -r tests/e2e/requirements.txt

      - name: Backend/API integration tests (deterministic fault-and-recovery)
        env:
          BACKEND_BASE_URL: http://localhost:8000
        run: |
          set -a; source .env; set +a
          export DATABASE_URL="postgresql+psycopg://${POSTGRES_USER:-factoryops}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB:-factoryops}"
          pytest tests/backend -v --junitxml=junit-backend-integration.xml

      - name: E2E demonstrations (worker stop/backlog recovery, poison/dead-letter)
        env:
          BACKEND_BASE_URL: http://localhost:8000
          RABBITMQ_MGMT_URL: http://localhost:15672
        run: |
          set -a; source .env; set +a
          export DATABASE_URL="postgresql+psycopg://${POSTGRES_USER:-factoryops}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB:-factoryops}"
          pytest tests/e2e -v -s --junitxml=junit-e2e.xml

      - name: Collect compose logs
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env logs --no-color > compose-logs.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### FactoryOps CI — compose integration"
            echo "Tested commit: \`${{ github.sha }}\`"
            echo "Run: ${{ github.run_id }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-integration-reports
          path: |
            junit-backend-integration.xml
            junit-e2e.xml
            compose-logs.txt
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env --profile simulate down -v
